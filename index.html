<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic-Tac-Toe | VOSC Activity 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            
            <h1>Tic-Tac-Toe</h1>
            <p class="subtitle">Classic two-player game</p>
        </header>

        <section class="score-board" aria-label="Score board">

            <div class="player-card player-x">
                <span class="player-symbol">X</span>
                <span class="player-name">Player X</span>
                <span class="score" id="scoreX">0</span>
            </div>

            <div class="player-card player-o">
                <span class="player-symbol">O</span>
                <span class="player-name">Player O</span>
                <span class="score" id="scoreO">0</span>
            </div>

        </section>

        <p id="status" class="status" aria-live="polite">
            Player X's Turn
        </p>

        <section class="board" aria-label="Tic-Tac-Toe board">

            <button class="cell" data-index="0" aria-label="Cell 1"></button>
            <button class="cell" data-index="1" aria-label="Cell 2"></button>
            <button class="cell" data-index="2" aria-label="Cell 3"></button>

            <button class="cell" data-index="3" aria-label="Cell 4"></button>
            <button class="cell" data-index="4" aria-label="Cell 5"></button>
            <button class="cell" data-index="5" aria-label="Cell 6"></button>

            <button class="cell" data-index="6" aria-label="Cell 7"></button>
            <button class="cell" data-index="7" aria-label="Cell 8"></button>
            <button class="cell" data-index="8" aria-label="Cell 9"></button>

        </section>

        <div class="game-buttons">
            <button id="newGame" class="primary-button">
                New Game
            </button>

            <button id="resetScore" class="secondary-button">
                Reset Score
            </button>
        </div>

        <footer>
            <p>Made with HTML, CSS &amp; JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
